        --card-bg: #161a22;

        --overlay: rgba(0, 0, 0, 0.75);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-top: max(20px, calc(env(safe-area-inset-top) + 8px));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: max(22px, env(safe-area-inset-bottom));
      padding-left: max(14px, env(safe-area-inset-left));
      display: flex;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 0 0 24px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-x: hidden;
      box-sizing: border-box;

    .tabular {
      font-variant-numeric: tabular-nums;

    /* Header */
    header {

      align-items: center;

      padding: 0 0 2px 0;
      width: 100%;
      box-sizing: border-box;
    }

      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;

    .brand-logo-wrap {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.35);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .icon-btn:active {
      transform: scale(0.94);
      background: var(--card-sub);
    }

    .btn-lang {
      height: 38px;
      padding: 0 10px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-lang:active {
      background: var(--card-sub);
    }

    /* Auto Update Banner */
    .banner-update {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      width: 100%;
      box-sizing: border-box;
      animation: slideDown 0.3s ease;

    @keyframes slideDown {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }

    .banner-update-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .update-badge {
      background: #ffffff;
      color: #059669;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .btn-update-now {
      background: #ffffff;
      color: #059669;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-update-now:active {
      opacity: 0.85;
    }

      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: var(--shadow);
      width: 100%;
      box-sizing: border-box;

        border-color: #92400e;

      border-radius: 8px;

      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .date-box-icon {
      color: var(--primary);
      flex-shrink: 0;
    }

    .date-display-text {
      font-size: clamp(0.82rem, 3.2vw, 0.94rem);
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      letter-spacing: -0.01em;

    /* Invisible overlay of the native date picker covering 100% of the box */
    .date-picker-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
    }

    /* Disable native webkit indicator visually */
    .date-picker-overlay::-webkit-calendar-picker-indicator {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      opacity: 0;
      cursor: pointer;
      -webkit-appearance: none;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;

      width: 100%;

    }

    /* Main Remaining Budget Card */
    .hero-card {

      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;

    .hero-card-refresh {

      top: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--card-sub);
      border: 1px solid var(--border);
      color: var(--text-muted);

      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, color 0.2s;

    .hero-card-refresh:active {
      transform: scale(0.9);
    }

    .hero-card-refresh.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    .hero-label {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
      padding-top: 4px;

    .hero-amount {

      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .hero-amount.positive {
      color: var(--green);
    }

    .hero-amount.negative {
      color: var(--red);
    }

    .discount-calc-line {
      font-size: 0.92rem;
      color: var(--text);
      background: var(--card-sub);

      border-radius: 12px;

      color: var(--primary);

    .sub-cards-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 2px;
    }

    .sub-card {
      background: var(--card-sub);
      padding: 10px 12px;
      border-radius: 14px;
      text-align: center;
    }

    .sub-card-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .sub-card-val {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--progress-bg);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.4s ease, background-color 0.3s;
      border-radius: 6px;
    }

    .progress-bar-fill.exceeded {
      background: var(--red);
    }

    /* Detail Records */
    .records-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .records-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .records-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .records-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-sub);
      padding: 11px 13px;
      border-radius: 12px;
      font-size: 0.94rem;
    }

    .record-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .record-time-box {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .record-time {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);

    .record-tag {
      font-size: 0.68rem;
      padding: 1px 5px;

      color: var(--badge-text);

      line-height: 1.2;

      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .record-amount {
      font-weight: 700;
      font-size: 1.05rem;
      flex-shrink: 0;
      margin-left: 10px;
    }

    /* States */
    .state-box {
      text-align: center;
      padding: 30px 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-text {
      color: var(--red);
    }

    /* Modals (Settings & Share) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-sheet {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;

      padding: 20px;
      transform: translateY(20px) scale(0.96);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.open .modal-sheet {
      transform: translateY(0) scale(1);
    }

      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

      width: 34px;
      height: 34px;
      border-radius: 50%;

      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);

    .form-group input:focus {
      border-color: var(--primary);
    }

    .btn-modal-action {
      height: 44px;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 600;
      border: none;
      background: var(--primary);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-modal-action:active {
      opacity: 0.85;
    }

    .save-feedback {
      text-align: center;
      color: var(--green);
      font-size: 0.88rem;
      font-weight: 600;
      min-height: 20px;
    }

    /* Version & Update Section in Settings */
    .version-section {
      background: var(--card-sub);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-top: 4px;

      flex-direction: column;
      gap: 8px;

    .version-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-muted);

    .version-tag {
      background: var(--primary);
      color: #ffffff;

      font-weight: 700;
      padding: 2px 8px;
      border-radius: 8px;

      gap: 8px;

    .btn-ver-action {
      height: 36px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-ver-action:active {
      background: var(--card-sub);
    }

    /* Share Options in Share Modal */

      display: flex;
      align-items: center;
      background: var(--card-sub);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 6px 6px 12px;
      gap: 6px;
    }

    .share-url-text {
      flex: 1;
      font-size: 0.85rem;
      color: var(--text-muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      user-select: all;
    }

    .btn-copy {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .share-buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-share-item {
      height: 44px;
      border-radius: 12px;
      background: var(--card-sub);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-share-item.line {
      background: #06c755;
      color: #ffffff;
      border: none;

    .share-tip {

    /* Toast */
    .toast {
      position: fixed;
      bottom: max(20px, calc(16px + env(safe-area-inset-bottom)));

      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>

        refresh: "Refresh",

        empSn: "Worker ID",
        empSnPlaceholder: "e.g. 1234567",
        dailyBudget: "Daily budget",
        discount: "Discount",
        save: "Save",
        saved: "Saved ✓",
        loading: "Loading...",
        loadFailed: "Load failed: ",
        noRecords: "No records this day",
        budgetUsedUp: "Budget used up",
        nextDayTag: "+1d",
        itemsCount: (n) => `${n} item(s)`,
        unit: "NT$",
        beforeDiscount: (S, divShow) => `Before discount: <b>${S}</b> NT$ (${divShow} NT$)`,
        bannerNotice: "💡 Worker ID not set. Please set your ID first",
        bannerAction: "Set ID",
        needWorkerIdPrompt: "Please tap ⚙️ Settings above to set your Worker ID",
        shareTitle: "Share Meal Budget Helper",
        copyLink: "Copy Link",
        copied: "URL copied to clipboard!",
        nativeShare: "Share",
        shareText: "Meal Budget Helper - Check dining records & remaining budget",
        shareTip: "📱 <b>Add to Home Screen:</b><br>• <b>iPhone Safari</b>: Tap Share ➔ 'Add to Home Screen'<br>• <b>Android Chrome</b>: Tap menu (⋮) ➔ 'Add to Home Screen'",
        appVer: "App Version",
        checkUpdate: "Check Update",
        forceReload: "Force Reload",
        updateAvailable: "New version available!",
        updateNow: "Update Now",
        checkingUpdate: "Checking for updates...",
        alreadyLatest: `Already up to date (v${APP_VERSION})`,
        reloadingLatest: "Loading latest version..."
      }
    };

    // State - Worker ID defaults to BLANK
    const defaultSettings = {
      employee_sn: "",
      budget: 300,
      discount: 0.85
    };

    let settings = { ...defaultSettings };
    let currentLang = 'zh'; // Always default to Traditional Chinese
    let selectedDate = '';

    // Calculate Micron Budget Day Date String (04:00 AM turnover)
    function getBudgetTodayDateString() {
      const budgetNow = new Date(Date.now() - 4 * 3600 * 1000);
      const y = budgetNow.getFullYear();
      const m = String(budgetNow.getMonth() + 1).padStart(2, '0');
      const d = String(budgetNow.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // Default to Traditional Chinese unless explicitly switched
    function initLanguage() {
      const savedLang = localStorage.getItem('eatwell_lang');
      if (savedLang === 'zh' || savedLang === 'en') {
        currentLang = savedLang;
      } else {
        currentLang = 'zh'; // Guarantee Traditional Chinese by default
      }
    }

    function loadSettings() {
      let isConfigured = false;
      try {
        const stored = localStorage.getItem('eatwell_settings');
        if (stored) {
          const parsed = JSON.parse(stored);
          settings.employee_sn = parsed.employee_sn !== undefined ? String(parsed.employee_sn).trim() : "";
          settings.budget = Number(parsed.budget) || defaultSettings.budget;
          settings.discount = Number(parsed.discount) || defaultSettings.discount;
          if (settings.employee_sn) {
            isConfigured = true;
          }
        }
      } catch (e) {
        settings = { ...defaultSettings };
      }

      document.getElementById('cfgEmployeeSn').value = settings.employee_sn;
      document.getElementById('cfgBudget').value = settings.budget;
      document.getElementById('cfgDiscount').value = settings.discount;

      checkWorkerIdPrompt(isConfigured);
      return isConfigured;
    }

    function checkWorkerIdPrompt(isConfigured) {
      const banner = document.getElementById('unconfiguredBanner');
      if (!settings.employee_sn) {
        banner.style.display = 'flex';
      } else {
        banner.style.display = 'none';
      }
    }

    function saveSettings() {
      const sn = document.getElementById('cfgEmployeeSn').value.trim();
      const bg = Number(document.getElementById('cfgBudget').value);
      const dc = Number(document.getElementById('cfgDiscount').value);

      if (!sn) {
        alert(currentLang === 'zh' ? '請輸入工號' : 'Please enter Worker ID');
        return;
      }

      settings.employee_sn = sn;
      settings.budget = isNaN(bg) ? 300 : bg;
      settings.discount = (isNaN(dc) || dc <= 0) ? 0.85 : dc;

      localStorage.setItem('eatwell_settings', JSON.stringify(settings));

      const feedback = document.getElementById('saveFeedback');
      feedback.textContent = i18n[currentLang].saved;
      checkWorkerIdPrompt(true);

      setTimeout(() => {
        feedback.textContent = '';
        closeModal('settingsModal');
      }, 700);

      fetchDiningRecords();
    }

    function updateTexts() {
      const t = i18n[currentLang];
      document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
      document.getElementById('brandTitle').textContent = t.appTitle;
      document.getElementById('langBtn').textContent = currentLang === 'zh' ? 'EN' : '中';
      document.getElementById('lblRemaining').textContent = t.remaining;
      document.getElementById('lblTodayTotal').textContent = t.todayTotal;
      document.getElementById('lblBudget').textContent = t.budget;
      document.getElementById('lblRecords').textContent = t.records;
      document.getElementById('txtBtnToday').textContent = t.today;
      document.getElementById('titleSettings').textContent = t.settingsSummary;
      document.getElementById('lblEmpSn').textContent = t.empSn;
      document.getElementById('cfgEmployeeSn').placeholder = t.empSnPlaceholder;
      document.getElementById('lblDailyBudget').textContent = t.dailyBudget;
      document.getElementById('lblDiscount').textContent = t.discount;
      document.getElementById('btnSaveSettings').textContent = t.save;
      document.getElementById('txtBannerNotice').textContent = t.bannerNotice;
      document.getElementById('btnBannerSet').textContent = t.bannerAction;
      document.getElementById('titleShare').textContent = t.shareTitle;
      document.getElementById('btnCopyUrl').textContent = t.copyLink;
      document.getElementById('txtNativeShare').textContent = t.nativeShare;
      document.getElementById('shareTip').innerHTML = t.shareTip;

      // Version controls
      document.getElementById('lblAppVer').textContent = t.appVer;
      document.getElementById('txtCheckUpdate').textContent = t.checkUpdate;
      document.getElementById('txtForceReload').textContent = t.forceReload;
      document.getElementById('txtUpdateAvailable').textContent = t.updateAvailable;
      document.getElementById('btnApplyUpdate').textContent = t.updateNow;

      // Update Line share URL
      const cleanUrl = getCleanShareUrl();
      document.getElementById('btnLineShare').href = `https://line.me/R/msg/text/?${encodeURIComponent(t.shareText + '\n' + cleanUrl)}`;
    }

    // Update Centered Date Display text
    function updateDateDisplay() {
      if (!selectedDate) return;
      const formatted = selectedDate.replace(/-/g, '/');
      document.getElementById('dateDisplayText').textContent = formatted;
    }

    function shiftDate(days) {
      if (!selectedDate) return;
      const parts = selectedDate.split('-');
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      d.setDate(d.getDate() + days);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const date = String(d.getDate()).padStart(2, '0');
      selectedDate = `${y}-${m}-${date}`;
      document.getElementById('dateInput').value = selectedDate;
      updateDateDisplay();
      fetchDiningRecords();
    }

    async function fetchDiningRecords() {
      const t = i18n[currentLang];
      const container = document.getElementById('recordsContainer');
      const countEl = document.getElementById('recordsCount');
      const refreshBtn = document.getElementById('btnRefresh');

      if (!settings.employee_sn) {
        container.innerHTML = `
          <div class="state-box">
            <div>${t.needWorkerIdPrompt}</div>
          </div>
        `;
        renderStats(0);
        countEl.textContent = t.itemsCount(0);
        return;
      }

      refreshBtn.classList.add('spinning');
      container.innerHTML = `
        <div class="state-box">
          <div class="spinner"></div>
          <div>${t.loading}</div>
        </div>
      `;

      // Check for standalone app updates in background when refreshing
      checkForAppUpdates(false);

      const params = new URLSearchParams();
      params.append('start_date', selectedDate);
      params.append('end_date', selectedDate);
      params.append('employee_sn', settings.employee_sn);

      try {
        const resp = await fetch('https://pos-api-micron.dudooeat.com/reports/employeesDiningRecords', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: params.toString(),
          credentials: 'omit'
        });

        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status}`);
        }

        const resData = await resp.json();
        const records = (resData && resData.data && Array.isArray(resData.data.records)) ? resData.data.records : [];
        renderRecords(records);
      } catch (err) {
        container.innerHTML = `
          <div class="state-box error-text">
            <div>${t.loadFailed}${err.message || err}</div>
          </div>
        `;
        renderStats(0);
        countEl.textContent = t.itemsCount(0);
      } finally {
        setTimeout(() => { refreshBtn.classList.remove('spinning'); }, 300);
      }
    }

    function renderStats(totalSpent) {
      const t = i18n[currentLang];
      const budget = settings.budget;
      const remain = budget - totalSpent;
      const discount = settings.discount;

      const valRemaining = document.getElementById('valRemaining');
      valRemaining.textContent = `${remain} ${t.unit}`;
      if (remain >= 0) {
        valRemaining.className = 'hero-amount tabular positive';
      } else {
        valRemaining.className = 'hero-amount tabular negative';
      }

      document.getElementById('valTodayTotal').textContent = `${totalSpent} ${t.unit}`;
      document.getElementById('valBudget').textContent = `${budget} ${t.unit}`;

      // Discount calculation formula required by prompt
      const valDiscountLine = document.getElementById('valDiscountLine');
      if (remain <= 0) {
        valDiscountLine.textContent = t.budgetUsedUp;
      } else {
        const d = discount;
        const divShow = Math.round((remain / d) * 10) / 10;
        const charge = S => Math.floor(S * d + 0.4 + 1e-9);
        let S = Math.ceil(remain / d) + 2;
        while (S > 0 && charge(S) > remain) S--;

        valDiscountLine.innerHTML = t.beforeDiscount(S, divShow);
      }

      // Progress bar
      const bar = document.getElementById('progressBar');
      const pct = budget > 0 ? (totalSpent / budget) * 100 : 0;
      bar.style.width = `${Math.min(pct, 100)}%`;
      if (pct > 100) {
        bar.classList.add('exceeded');
      } else {
        bar.classList.remove('exceeded');
      }
    }

    function renderRecords(records) {
      const t = i18n[currentLang];
      const container = document.getElementById('recordsContainer');
      const countEl = document.getElementById('recordsCount');

      // Sort by meal_time ascending
      records.sort((a, b) => {
        const ta = a.meal_time || '';
        const tb = b.meal_time || '';
        return ta.localeCompare(tb);
      });

      let totalSpent = 0;
      records.forEach(r => {
        totalSpent += (Number(r.amount) || 0);
      });

      renderStats(totalSpent);
      countEl.textContent = t.itemsCount(records.length);

      if (records.length === 0) {
        container.innerHTML = `
          <div class="state-box">
            <div>${t.noRecords}</div>
          </div>
        `;
        return;
      }

      const list = document.createElement('div');
      list.className = 'records-list';

      records.forEach(r => {
        const row = document.createElement('div');
        row.className = 'record-item';

        // Extract HH:mm and check if before 04:00 (next day tag)
        let timeStr = '--:--';
        let isNextDay = false;
        if (r.meal_time) {
          const parts = r.meal_time.split(' ');
          if (parts[1]) {
            const timeSplits = parts[1].split(':');
            const hour = parseInt(timeSplits[0], 10);
            timeStr = `${parts[1].substring(0, 5)}`;
            if (!isNaN(hour) && hour < 4) {
              isNextDay = true;
            }
          }
        }

        // Shop name extraction: dining_at first underscore substring
        const diningAt = r.dining_at || '';
        const underscoreIndex = diningAt.indexOf('_');
        const shopName = underscoreIndex >= 0 ? diningAt.substring(underscoreIndex + 1) : diningAt;

        const left = document.createElement('div');
        left.className = 'record-left';

        const timeBox = document.createElement('div');
        timeBox.className = 'record-time-box tabular';

        const timeSpan = document.createElement('span');
        timeSpan.className = 'record-time';
        timeSpan.textContent = timeStr;
        timeBox.appendChild(timeSpan);

        if (isNextDay) {
          const tag = document.createElement('span');
          tag.className = 'record-tag';
          tag.textContent = t.nextDayTag;
          timeBox.appendChild(tag);
        }

        const shopSpan = document.createElement('span');
        shopSpan.className = 'record-shop';
        shopSpan.textContent = shopName || '—';
        shopSpan.title = shopName;

        left.appendChild(timeBox);
        left.appendChild(shopSpan);

        const amountSpan = document.createElement('div');
        amountSpan.className = 'record-amount tabular';
        amountSpan.textContent = `${Number(r.amount) || 0} ${t.unit}`;

        row.appendChild(left);
        row.appendChild(amountSpan);
        list.appendChild(row);
      });

      container.innerHTML = '';
      container.appendChild(list);
    }

    // Modal Helpers
    function openModal(id) {
      document.getElementById(id).classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    // Toast Helper
    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2200);
    }

    // Version Check & Standalone Cache Update
    async function checkForAppUpdates(manual = false) {
      const t = i18n[currentLang];
      if (manual) showToast(t.checkingUpdate);

      try {
        const resp = await fetch(`./index.html?_chk=${Date.now()}`, {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
        });

        if (!resp.ok) return;
        const html = await resp.text();
        const match = html.match(/<meta\s+name=["']app-version["']\s+content=["'](.*?)["']/i);
        
        if (match && match[1]) {
          const remoteVer = match[1].trim();
          if (remoteVer !== APP_VERSION) {
            document.getElementById('updateBanner').style.display = 'flex';
            if (manual) {
              closeModal('settingsModal');
            }
            return;
          }
        }

        if (manual) {
          showToast(t.alreadyLatest);
        }
      } catch (err) {
        if (manual) showToast(t.alreadyLatest);
      }
    }

    // Helper to get clean canonical share URL without query params (such as cache-busting ?_v=...)
    function getCleanShareUrl() {
      return window.location.origin + window.location.pathname;
    }

    // Force Standalone WebKit Cache Busting
    function applyAppUpdate() {
      const t = i18n[currentLang];
      showToast(t.reloadingLatest);
      setTimeout(() => {
        const url = new URL(window.location.origin + window.location.pathname);
        url.searchParams.set('_v', Date.now());
        window.location.replace(url.toString());
      }, 350);
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      // Silently clean cache-busting or other query params from address bar without reloading
      if (window.location.search) {
        try {
          window.history.replaceState({}, document.title, window.location.pathname);
        } catch (e) {}
      }

      initLanguage();
      const hasConfig = loadSettings();
      updateTexts();

      // Set URL preview for share
      document.getElementById('shareUrlPreview').textContent = getCleanShareUrl();

      selectedDate = getBudgetTodayDateString();
      const dateInput = document.getElementById('dateInput');
      dateInput.value = selectedDate;
      updateDateDisplay();

      // Date input changes
      dateInput.addEventListener('change', (e) => {
        if (e.target.value) {
          selectedDate = e.target.value;
          updateDateDisplay();
          fetchDiningRecords();
        }
      });

      // Show native date picker on tap
      dateInput.addEventListener('click', () => {
        if (typeof dateInput.showPicker === 'function') {
          try { dateInput.showPicker(); } catch (err) {}
        }
      });

      // First time without worker ID: auto open settings modal
      if (!hasConfig) {
        setTimeout(() => {
          openModal('settingsModal');
        }, 300);
      }

      // Check updates on startup
      checkForAppUpdates(false);

      // Check updates when switching back to standalone app from background
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          checkForAppUpdates(false);
        }
      });

      // Update banner click
      document.getElementById('btnApplyUpdate').addEventListener('click', applyAppUpdate);

      // Settings modal version check & force reload
      document.getElementById('btnCheckUpdate').addEventListener('click', () => checkForAppUpdates(true));
      document.getElementById('btnForceReload').addEventListener('click', applyAppUpdate);

      // Lang toggle
      document.getElementById('langBtn').addEventListener('click', () => {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        localStorage.setItem('eatwell_lang', currentLang);
        updateTexts();
        fetchDiningRecords();
      });

      // Settings modal triggers
      document.getElementById('settingsBtn').addEventListener('click', () => openModal('settingsModal'));
      document.getElementById('btnBannerSet').addEventListener('click', () => openModal('settingsModal'));
      document.getElementById('btnCloseSettings').addEventListener('click', () => closeModal('settingsModal'));
      document.getElementById('settingsModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('settingsModal')) closeModal('settingsModal');
      });

      // Share modal triggers
      document.getElementById('shareBtn').addEventListener('click', () => {
        document.getElementById('shareUrlPreview').textContent = getCleanShareUrl();
        openModal('shareModal');
      });
      document.getElementById('btnCloseShare').addEventListener('click', () => closeModal('shareModal'));
      document.getElementById('shareModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('shareModal')) closeModal('shareModal');
      });

      // Copy URL button
      document.getElementById('btnCopyUrl').addEventListener('click', async () => {
        const cleanUrl = getCleanShareUrl();
        try {
          await navigator.clipboard.writeText(cleanUrl);
          showToast(i18n[currentLang].copied);
        } catch (err) {
          const inp = document.createElement('input');
          inp.value = cleanUrl;
          document.body.appendChild(inp);
          inp.select();
          document.execCommand('copy');
          document.body.removeChild(inp);
          showToast(i18n[currentLang].copied);
        }
      });

      // Native Share API
      document.getElementById('btnNativeShare').addEventListener('click', async () => {
        const t = i18n[currentLang];
        const cleanUrl = getCleanShareUrl();
        if (navigator.share) {
          try {
            await navigator.share({
              title: t.appTitle,
              text: t.shareText,
              url: cleanUrl
            });
          } catch (e) {
            // User cancelled or ignored
          }
        } else {
          // Fallback to copy
          try {
            await navigator.clipboard.writeText(cleanUrl);
            showToast(t.copied);
          } catch (e) {}
        }
      });

      // Prev / Next day
      document.getElementById('btnPrevDay').addEventListener('click', () => shiftDate(-1));
      document.getElementById('btnNextDay').addEventListener('click', () => shiftDate(1));

      // Today button (Left of date row)
      document.getElementById('btnToday').addEventListener('click', () => {
        selectedDate = getBudgetTodayDateString();
        dateInput.value = selectedDate;
        updateDateDisplay();
        fetchDiningRecords();
      });

      // Refresh button (Inside Hero Card)
      document.getElementById('btnRefresh').addEventListener('click', () => {
        fetchDiningRecords();
      });

      // Save settings
      document.getElementById('btnSaveSettings').addEventListener('click', saveSettings);

      // Initial Fetch
      fetchDiningRecords();
    });
  </script>
</body>
</html>
