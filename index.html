  <style>
    :root {
      --bg: #f6f8fb;
      --card-bg: #ffffff;
      --card-sub: #f1f4f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #1f7ae0;
      --primary-hover: #1664be;
      --green: #10b981;
      --red: #ef4444;
      --badge-bg: #fee2e2;
      --badge-text: #dc2626;
      --progress-bg: #e2e8f0;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
      --overlay: rgba(15, 23, 42, 0.55);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0f14;
        --card-bg: #161a22;
        --card-sub: #1f2530;
        --border: #28303e;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --green: #22c55e;
        --red: #f87171;
        --badge-bg: #451a1a;
        --badge-text: #fca5a5;
        --progress-bg: #28303e;
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        --overlay: rgba(0, 0, 0, 0.75);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* iPhone Notch, Dynamic Island, and Android Punch-Hole Safe Areas */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      /* Generous headroom for Dynamic Island and Notch */
      padding-top: max(20px, calc(env(safe-area-inset-top) + 8px));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: max(22px, env(safe-area-inset-bottom));
      padding-left: max(14px, env(safe-area-inset-left));
      display: flex;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 0 0 24px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 2px 0;
      width: 100%;
      box-sizing: border-box;
    }

    .brand-title {
      font-size: 1.22rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo-wrap {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.35);
      flex-shrink: 0;
      padding: 5px;
    }

    .brand-logo-svg {
      width: 100%;
      height: 100%;
    }

    .brand-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .icon-btn:active {
      transform: scale(0.94);
      background: var(--card-sub);
    }

    .btn-lang {
      height: 38px;
      padding: 0 10px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-lang:active {
      background: var(--card-sub);
    }

    /* Warning Banner for Unset Worker ID */
    .banner-warning {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      color: #92400e;
      border: 1px solid #fcd34d;
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: var(--shadow);
      width: 100%;
      box-sizing: border-box;
    }

    @media (prefers-color-scheme: dark) {
      .banner-warning {
        background: linear-gradient(135deg, #451a03, #78350f);
        color: #fef3c7;
        border-color: #92400e;
      }
    }

    .banner-warning button {
      background: #d97706;
      color: #ffffff;
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Date controls (At Top) - Strict iOS Anti-Overflow */
    .date-section {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .btn-today {
      flex: 0 0 auto;
      height: 38px;
      padding: 0 9px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--primary);
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .btn-today:active {
      background: var(--card-sub);
    }

    .btn-nav-day {
      flex: 0 0 32px;
      width: 32px;
      height: 38px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-sizing: border-box;
    }

    .btn-nav-day:active {
      background: var(--card-sub);
    }

    .date-input-wrapper {
      flex: 1 1 0%;
      min-width: 0;
      height: 38px;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .date-picker {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      max-width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: clamp(0.76rem, 3.2vw, 0.9rem);
      font-weight: 600;
      text-align: center;
      padding: 0 2px;
      margin: 0;
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
    }

    .date-picker::-webkit-date-and-time-value {
      margin: 0;
      padding: 0;
      text-align: center;
      min-height: 1.2em;
      line-height: 36px;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
      width: 100%;
      box-sizing: border-box;
    }

    /* Main Remaining Budget Card */
    .hero-card {
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hero-card-refresh {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--card-sub);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, color 0.2s;
    }

    .hero-card-refresh:active {
      transform: scale(0.9);
    }

    .hero-card-refresh.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    .hero-label {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
      padding-top: 4px;
    }

    .hero-amount {
      font-size: clamp(2.5rem, 9vw, 3.1rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .hero-amount.positive {
      color: var(--green);
    }

    .hero-amount.negative {
      color: var(--red);
    }

    .discount-calc-line {
      font-size: 0.92rem;
      color: var(--text);
      background: var(--card-sub);
      padding: 8px 10px;
      border-radius: 12px;
      word-break: break-word;
    }

    .discount-calc-line b {
      color: var(--primary);
      font-size: 1.08rem;
    }

    .sub-cards-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 2px;
    }

    .sub-card {
      background: var(--card-sub);
      padding: 10px 12px;
      border-radius: 14px;
      text-align: center;
    }

    .sub-card-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .sub-card-val {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--progress-bg);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.4s ease, background-color 0.3s;
      border-radius: 6px;
    }

    .progress-bar-fill.exceeded {
      background: var(--red);
    }

    /* Detail Records */
    .records-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .records-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .records-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .records-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-sub);
      padding: 11px 13px;
      border-radius: 12px;
      font-size: 0.94rem;
    }

    .record-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .record-time-box {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .record-time {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .record-tag {
      font-size: 0.68rem;
      padding: 1px 5px;
      border-radius: 6px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-weight: 700;
      line-height: 1.2;
    }

    .record-shop {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .record-amount {
      font-weight: 700;
      font-size: 1.05rem;
      flex-shrink: 0;
      margin-left: 10px;
    }

    /* States */
    .state-box {
      text-align: center;
      padding: 30px 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-text {
      color: var(--red);
    }

    /* Modals (Settings & Share) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-sheet {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
      padding: 20px;
      transform: translateY(20px) scale(0.96);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.open .modal-sheet {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .modal-close-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--card-sub);
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-group input {
      height: 44px;
      background: var(--card-sub);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      padding: 0 12px;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .btn-modal-action {
      height: 44px;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 600;
      border: none;
      background: var(--primary);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-modal-action:active {
      opacity: 0.85;
    }

    .save-feedback {
      text-align: center;
      color: var(--green);
      font-size: 0.88rem;
      font-weight: 600;
      min-height: 20px;
    }

    /* Share Options in Share Modal */
    .share-link-box {
      display: flex;
      align-items: center;
      background: var(--card-sub);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 6px 6px 12px;
      gap: 6px;
    }

    .share-url-text {
      flex: 1;
      font-size: 0.85rem;
      color: var(--text-muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      user-select: all;
    }

    .btn-copy {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .share-buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-share-item {
      height: 44px;
      border-radius: 12px;
      background: var(--card-sub);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-share-item.line {
      background: #06c755;
      color: #ffffff;
      border: none;
    }

    .share-tip {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
      background: var(--card-sub);
      padding: 10px 12px;
      border-radius: 10px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: max(20px, calc(16px + env(safe-area-inset-bottom)));
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      z-index: 10000;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="brand-title">
        <div class="brand-logo-wrap" title="刷餐小幫手">
          <svg class="brand-logo-svg" viewBox="0 0 100 100" fill="none">

            <circle cx="50" cy="50" r="38" stroke="#ffffff" stroke-width="5" fill="#ffffff" fill-opacity="0.2"/>

          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">

            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Unconfigured Notice Banner -->
    <div class="banner-warning" id="unconfiguredBanner" style="display: none;">
      <span id="txtBannerNotice">💡 尚未設定工號，請先設定您的員工工號</span>

    <!-- Date Section (Moved to the Top) - Strict iOS Layout -->

    <!-- Main Remaining Budget Card -->
    <div class="card hero-card">
      <button type="button" class="hero-card-refresh" id="btnRefresh" aria-label="Refresh" title="重新整理">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title" id="titleSettings">設定（工號/預算/折扣）</div>
        <button type="button" class="modal-close-btn" id="btnCloseSettings">✕</button>

      <div class="modal-body">
        <div class="form-group">
          <label for="cfgEmployeeSn" id="lblEmpSn">工號</label>
          <input type="text" id="cfgEmployeeSn" class="tabular" inputmode="numeric" placeholder="例如：1234567">

        <div class="form-group">
          <label for="cfgBudget" id="lblDailyBudget">每日預算</label>
          <input type="number" id="cfgBudget" class="tabular" step="1" min="0">

        <div class="form-group">

          <input type="number" id="cfgDiscount" class="tabular" step="0.01" min="0" max="1">

  <!-- Share Modal -->

              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>

          <a class="btn-share-item line" id="btnLineShare" target="_blank" rel="noopener noreferrer">

              <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>

          • <b>iPhone Safari</b>：點擊下方「分享」按鈕 ➔ 選擇「加入主畫面」<br>
          • <b>Android Chrome</b>：點擊右上角選單（⋮） ➔ 選擇「加到主畫面」

  <!-- Toast Notification -->
  <div class="toast" id="toast">已複製網址到剪貼簿！</div>

  <script>
    // i18n Dictionary
    const i18n = {
      zh: {
        appTitle: "刷餐小幫手",
        remaining: "剩餘預算",
        todayTotal: "當日用餐總額",
        budget: "刷餐預算",
        records: "用餐明細",
        today: "回到今天",
        refresh: "重新整理",
        settingsSummary: "設定（工號/預算/折扣）",
        empSn: "工號",
        empSnPlaceholder: "例如：1234567",
        dailyBudget: "每日預算",
        discount: "折扣",
        save: "儲存設定",
        saved: "已儲存 ✓",
        loading: "載入中...",
        loadFailed: "載入失敗：",
        noRecords: "這天沒有用餐紀錄",
        budgetUsedUp: "今日預算已用完",
        nextDayTag: "隔日",
        itemsCount: (n) => `${n} 筆`,
        unit: "元",
        beforeDiscount: (S, divShow) => `85折前還可刷：<b>${S}</b> 元 （${divShow} 元）`,
        bannerNotice: "💡 尚未設定工號，請先設定您的員工工號",
        bannerAction: "前往設定",
        needWorkerIdPrompt: "請先點擊右上角 ⚙️ 設定工號以查詢用餐紀錄",
        shareTitle: "分享刷餐小幫手",
        copyLink: "複製網址",
        copied: "已複製網址到剪貼簿！",
        nativeShare: "手機分享",
        shareText: "Micron 員工刷餐小幫手 - 查刷餐紀錄、算當日剩餘預算",
        shareTip: "📱 <b>加入主畫面教學：</b><br>• <b>iPhone Safari</b>：點擊下方「分享」按鈕 ➔ 選擇「加入主畫面」<br>• <b>Android Chrome</b>：點擊右上角選單（⋮） ➔ 選擇「加到主畫面」"
      },
      en: {
        appTitle: "Meal Budget Helper",
        remaining: "Remaining",
        todayTotal: "Today's total",
        budget: "Budget",
        records: "Records",
        today: "Today",
        refresh: "Refresh",
        settingsSummary: "Settings (ID/budget/discount)",
        empSn: "Worker ID",
        empSnPlaceholder: "e.g. 1234567",
        dailyBudget: "Daily budget",
        discount: "Discount",
        save: "Save",
        saved: "Saved ✓",
        loading: "Loading...",
        loadFailed: "Load failed: ",
        noRecords: "No records this day",
        budgetUsedUp: "Budget used up",
        nextDayTag: "+1d",
        itemsCount: (n) => `${n} item(s)`,
        unit: "NT$",
        beforeDiscount: (S, divShow) => `Before discount: <b>${S}</b> NT$ (${divShow} NT$)`,
        bannerNotice: "💡 Worker ID not set. Please set your ID first",
        bannerAction: "Set ID",
        needWorkerIdPrompt: "Please tap ⚙️ Settings above to set your Worker ID",
        shareTitle: "Share Meal Budget Helper",
        copyLink: "Copy Link",
        copied: "URL copied to clipboard!",
        nativeShare: "Share",
        shareText: "Meal Budget Helper - Check dining records & remaining budget",
        shareTip: "📱 <b>Add to Home Screen:</b><br>• <b>iPhone Safari</b>: Tap Share ➔ 'Add to Home Screen'<br>• <b>Android Chrome</b>: Tap menu (⋮) ➔ 'Add to Home Screen'"
      }
    };

    // State - Worker ID defaults to BLANK
    const defaultSettings = {
      employee_sn: "",
      budget: 300,
      discount: 0.85
    };

    let settings = { ...defaultSettings };
    let currentLang = 'zh'; // Always default to Traditional Chinese
    let selectedDate = '';

    // Calculate Micron Budget Day Date String (04:00 AM turnover)
    function getBudgetTodayDateString() {
      const budgetNow = new Date(Date.now() - 4 * 3600 * 1000);
      const y = budgetNow.getFullYear();
      const m = String(budgetNow.getMonth() + 1).padStart(2, '0');
      const d = String(budgetNow.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // Default to Traditional Chinese unless explicitly switched
    function initLanguage() {
      const savedLang = localStorage.getItem('eatwell_lang');
      if (savedLang === 'zh' || savedLang === 'en') {
        currentLang = savedLang;
      } else {
        currentLang = 'zh'; // Guarantee Traditional Chinese by default
      }
    }

    function loadSettings() {
      let isConfigured = false;
      try {
        const stored = localStorage.getItem('eatwell_settings');
        if (stored) {
          const parsed = JSON.parse(stored);
          settings.employee_sn = parsed.employee_sn !== undefined ? String(parsed.employee_sn).trim() : "";
          settings.budget = Number(parsed.budget) || defaultSettings.budget;
          settings.discount = Number(parsed.discount) || defaultSettings.discount;
          if (settings.employee_sn) {
            isConfigured = true;
          }
        }
      } catch (e) {
        settings = { ...defaultSettings };
      }

      document.getElementById('cfgEmployeeSn').value = settings.employee_sn;
      document.getElementById('cfgBudget').value = settings.budget;
      document.getElementById('cfgDiscount').value = settings.discount;

      checkWorkerIdPrompt(isConfigured);
      return isConfigured;
    }

    function checkWorkerIdPrompt(isConfigured) {
      const banner = document.getElementById('unconfiguredBanner');
      if (!settings.employee_sn) {
        banner.style.display = 'flex';
      } else {
        banner.style.display = 'none';
      }
    }

    function saveSettings() {
      const sn = document.getElementById('cfgEmployeeSn').value.trim();
      const bg = Number(document.getElementById('cfgBudget').value);
      const dc = Number(document.getElementById('cfgDiscount').value);

      if (!sn) {
        alert(currentLang === 'zh' ? '請輸入工號' : 'Please enter Worker ID');
        return;
      }

      settings.employee_sn = sn;
      settings.budget = isNaN(bg) ? 300 : bg;
      settings.discount = (isNaN(dc) || dc <= 0) ? 0.85 : dc;

      localStorage.setItem('eatwell_settings', JSON.stringify(settings));

      const feedback = document.getElementById('saveFeedback');
      feedback.textContent = i18n[currentLang].saved;
      checkWorkerIdPrompt(true);

      setTimeout(() => {
        feedback.textContent = '';
        closeModal('settingsModal');
      }, 700);

      fetchDiningRecords();
    }

    function updateTexts() {
      const t = i18n[currentLang];
      document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
      document.getElementById('brandTitle').textContent = t.appTitle;
      document.getElementById('langBtn').textContent = currentLang === 'zh' ? 'EN' : '中';
      document.getElementById('lblRemaining').textContent = t.remaining;
      document.getElementById('lblTodayTotal').textContent = t.todayTotal;
      document.getElementById('lblBudget').textContent = t.budget;
      document.getElementById('lblRecords').textContent = t.records;
      document.getElementById('txtBtnToday').textContent = t.today;
      document.getElementById('titleSettings').textContent = t.settingsSummary;
      document.getElementById('lblEmpSn').textContent = t.empSn;
      document.getElementById('cfgEmployeeSn').placeholder = t.empSnPlaceholder;
      document.getElementById('lblDailyBudget').textContent = t.dailyBudget;
      document.getElementById('lblDiscount').textContent = t.discount;
      document.getElementById('btnSaveSettings').textContent = t.save;
      document.getElementById('txtBannerNotice').textContent = t.bannerNotice;
      document.getElementById('btnBannerSet').textContent = t.bannerAction;
      document.getElementById('titleShare').textContent = t.shareTitle;
      document.getElementById('btnCopyUrl').textContent = t.copyLink;
      document.getElementById('txtNativeShare').textContent = t.nativeShare;
      document.getElementById('shareTip').innerHTML = t.shareTip;

      // Update Line share URL
      const currentUrl = window.location.href;
      document.getElementById('btnLineShare').href = `https://line.me/R/msg/text/?${encodeURIComponent(t.shareText + '\n' + currentUrl)}`;
    }

    function shiftDate(days) {
      if (!selectedDate) return;
      const parts = selectedDate.split('-');
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      d.setDate(d.getDate() + days);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const date = String(d.getDate()).padStart(2, '0');
      selectedDate = `${y}-${m}-${date}`;
      document.getElementById('dateInput').value = selectedDate;
      fetchDiningRecords();
    }

    async function fetchDiningRecords() {
      const t = i18n[currentLang];
      const container = document.getElementById('recordsContainer');
      const countEl = document.getElementById('recordsCount');
      const refreshBtn = document.getElementById('btnRefresh');

      if (!settings.employee_sn) {
        container.innerHTML = `
          <div class="state-box">
            <div>${t.needWorkerIdPrompt}</div>
          </div>
        `;
        renderStats(0);
        countEl.textContent = t.itemsCount(0);
        return;
      }

      refreshBtn.classList.add('spinning');
      container.innerHTML = `
        <div class="state-box">
          <div class="spinner"></div>
          <div>${t.loading}</div>
        </div>
      `;

      const params = new URLSearchParams();
      params.append('start_date', selectedDate);
      params.append('end_date', selectedDate);
      params.append('employee_sn', settings.employee_sn);

      try {
        const resp = await fetch('https://pos-api-micron.dudooeat.com/reports/employeesDiningRecords', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: params.toString(),
          credentials: 'omit'
        });

        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status}`);
        }

        const resData = await resp.json();
        const records = (resData && resData.data && Array.isArray(resData.data.records)) ? resData.data.records : [];
        renderRecords(records);
      } catch (err) {
        container.innerHTML = `
          <div class="state-box error-text">
            <div>${t.loadFailed}${err.message || err}</div>
          </div>
        `;
        renderStats(0);
        countEl.textContent = t.itemsCount(0);
      } finally {
        setTimeout(() => { refreshBtn.classList.remove('spinning'); }, 300);
      }
    }

    function renderStats(totalSpent) {
      const t = i18n[currentLang];
      const budget = settings.budget;
      const remain = budget - totalSpent;
      const discount = settings.discount;

      const valRemaining = document.getElementById('valRemaining');
      valRemaining.textContent = `${remain} ${t.unit}`;
      if (remain >= 0) {
        valRemaining.className = 'hero-amount tabular positive';
      } else {
        valRemaining.className = 'hero-amount tabular negative';
      }

      document.getElementById('valTodayTotal').textContent = `${totalSpent} ${t.unit}`;
      document.getElementById('valBudget').textContent = `${budget} ${t.unit}`;

      // Discount calculation formula required by prompt
      const valDiscountLine = document.getElementById('valDiscountLine');
      if (remain <= 0) {
        valDiscountLine.textContent = t.budgetUsedUp;
      } else {
        const d = discount;
        const divShow = Math.round((remain / d) * 10) / 10;
        const charge = S => Math.floor(S * d + 0.4 + 1e-9);
        let S = Math.ceil(remain / d) + 2;
        while (S > 0 && charge(S) > remain) S--;

        valDiscountLine.innerHTML = t.beforeDiscount(S, divShow);
      }

      // Progress bar
      const bar = document.getElementById('progressBar');
      const pct = budget > 0 ? (totalSpent / budget) * 100 : 0;
      bar.style.width = `${Math.min(pct, 100)}%`;
      if (pct > 100) {
        bar.classList.add('exceeded');
      } else {
        bar.classList.remove('exceeded');
      }
    }

    function renderRecords(records) {
      const t = i18n[currentLang];
      const container = document.getElementById('recordsContainer');
      const countEl = document.getElementById('recordsCount');

      // Sort by meal_time ascending
      records.sort((a, b) => {
        const ta = a.meal_time || '';
        const tb = b.meal_time || '';
        return ta.localeCompare(tb);
      });

      let totalSpent = 0;
      records.forEach(r => {
        totalSpent += (Number(r.amount) || 0);
      });

      renderStats(totalSpent);
      countEl.textContent = t.itemsCount(records.length);

      if (records.length === 0) {
        container.innerHTML = `
          <div class="state-box">
            <div>${t.noRecords}</div>
          </div>
        `;
        return;
      }

      const list = document.createElement('div');
      list.className = 'records-list';

      records.forEach(r => {
        const row = document.createElement('div');
        row.className = 'record-item';

        // Extract HH:mm and check if before 04:00 (next day tag)
        let timeStr = '--:--';
        let isNextDay = false;
        if (r.meal_time) {
          const parts = r.meal_time.split(' ');
          if (parts[1]) {
            const timeSplits = parts[1].split(':');
            const hour = parseInt(timeSplits[0], 10);
            timeStr = `${parts[1].substring(0, 5)}`;
            if (!isNaN(hour) && hour < 4) {
              isNextDay = true;
            }
          }
        }

        // Shop name extraction: dining_at first underscore substring
        const diningAt = r.dining_at || '';
        const underscoreIndex = diningAt.indexOf('_');
        const shopName = underscoreIndex >= 0 ? diningAt.substring(underscoreIndex + 1) : diningAt;

        const left = document.createElement('div');
        left.className = 'record-left';

        const timeBox = document.createElement('div');
        timeBox.className = 'record-time-box tabular';

        const timeSpan = document.createElement('span');
        timeSpan.className = 'record-time';
        timeSpan.textContent = timeStr;
        timeBox.appendChild(timeSpan);

        if (isNextDay) {
          const tag = document.createElement('span');
          tag.className = 'record-tag';
          tag.textContent = t.nextDayTag;
          timeBox.appendChild(tag);
        }

        const shopSpan = document.createElement('span');
        shopSpan.className = 'record-shop';
        shopSpan.textContent = shopName || '—';
        shopSpan.title = shopName;

        left.appendChild(timeBox);
        left.appendChild(shopSpan);

        const amountSpan = document.createElement('div');
        amountSpan.className = 'record-amount tabular';
        amountSpan.textContent = `${Number(r.amount) || 0} ${t.unit}`;

        row.appendChild(left);
        row.appendChild(amountSpan);
        list.appendChild(row);
      });

      container.innerHTML = '';
      container.appendChild(list);
    }

    // Modal Helpers
    function openModal(id) {
      document.getElementById(id).classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    // Toast Helper
    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2200);
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      initLanguage();
      const hasConfig = loadSettings();
      updateTexts();

      // Set URL preview for share
      document.getElementById('shareUrlPreview').textContent = window.location.href;

      selectedDate = getBudgetTodayDateString();
      const dateInput = document.getElementById('dateInput');
      dateInput.value = selectedDate;

      // First time without worker ID: auto open settings modal
      if (!hasConfig) {
        setTimeout(() => {
          openModal('settingsModal');
        }, 300);
      }

      // Lang toggle
      document.getElementById('langBtn').addEventListener('click', () => {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        localStorage.setItem('eatwell_lang', currentLang);
        updateTexts();
        fetchDiningRecords();
      });

      // Settings modal triggers
      document.getElementById('settingsBtn').addEventListener('click', () => openModal('settingsModal'));
      document.getElementById('btnBannerSet').addEventListener('click', () => openModal('settingsModal'));
      document.getElementById('btnCloseSettings').addEventListener('click', () => closeModal('settingsModal'));
      document.getElementById('settingsModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('settingsModal')) closeModal('settingsModal');
      });

      // Share modal triggers
      document.getElementById('shareBtn').addEventListener('click', () => {
        document.getElementById('shareUrlPreview').textContent = window.location.href;
        openModal('shareModal');
      });
      document.getElementById('btnCloseShare').addEventListener('click', () => closeModal('shareModal'));
      document.getElementById('shareModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('shareModal')) closeModal('shareModal');
      });

      // Copy URL button
      document.getElementById('btnCopyUrl').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(window.location.href);
          showToast(i18n[currentLang].copied);
        } catch (err) {
          const inp = document.createElement('input');
          inp.value = window.location.href;
          document.body.appendChild(inp);
          inp.select();
          document.execCommand('copy');
          document.body.removeChild(inp);
          showToast(i18n[currentLang].copied);
        }
      });

      // Native Share API
      document.getElementById('btnNativeShare').addEventListener('click', async () => {
        const t = i18n[currentLang];
        if (navigator.share) {
          try {
            await navigator.share({
              title: t.appTitle,
              text: t.shareText,
              url: window.location.href
            });
          } catch (e) {
            // User cancelled or ignored
          }
        } else {
          // Fallback to copy
          try {
            await navigator.clipboard.writeText(window.location.href);
            showToast(t.copied);
          } catch (e) {}
        }
      });

      // Date input changes
      dateInput.addEventListener('change', (e) => {
        if (e.target.value) {
          selectedDate = e.target.value;
          fetchDiningRecords();
        }
      });

      // Prev / Next day
      document.getElementById('btnPrevDay').addEventListener('click', () => shiftDate(-1));
      document.getElementById('btnNextDay').addEventListener('click', () => shiftDate(1));

      // Today button (Left of date row)
      document.getElementById('btnToday').addEventListener('click', () => {
        selectedDate = getBudgetTodayDateString();
        dateInput.value = selectedDate;
        fetchDiningRecords();
      });

      // Refresh button (Inside Hero Card)
      document.getElementById('btnRefresh').addEventListener('click', () => {
        fetchDiningRecords();
      });

      // Save settings
      document.getElementById('btnSaveSettings').addEventListener('click', saveSettings);

      // Initial Fetch
      fetchDiningRecords();
    });
  </script>
</body>
</html>
